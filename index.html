<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="light">

  <main class="card">
    <header class="card-header">
      <h1>Temperature Converter</h1>
      <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </header>

    <p class="subtitle">Convert between Celsius, Fahrenheit and Kelvin.</p>

    <div class="field">
      <label for="tempInput">Temperature</label>
      <input
        id="tempInput"
        type="text"
        inputmode="decimal"
        maxlength="15"
        placeholder="Enter a value"
        autocomplete="off"
        aria-describedby="message" />
    </div>

    <div class="field">
      <label for="unitSelect">From unit</label>
      <select id="unitSelect">
        <option value="C">Celsius (&deg;C)</option>
        <option value="F">Fahrenheit (&deg;F)</option>
        <option value="K">Kelvin (K)</option>
      </select>
    </div>

    <p id="message" class="message" role="alert"></p>
    <p id="context" class="context"></p>

    <section class="results" aria-live="polite">
      <div class="result">
        <span class="result-label">Celsius</span>
        <span class="result-value" id="resultC">&mdash;</span>
        <button class="copy-btn" type="button" data-target="resultC" aria-label="Copy Celsius value">Copy</button>
      </div>

      <div class="result">
        <span class="result-label">Fahrenheit</span>
        <span class="result-value" id="resultF">&mdash;</span>
        <button class="copy-btn" type="button" data-target="resultF" aria-label="Copy Fahrenheit value">Copy</button>
      </div>

      <div class="result">
        <span class="result-label">Kelvin</span>
        <span class="result-value" id="resultK">&mdash;</span>
        <button class="copy-btn" type="button" data-target="resultK" aria-label="Copy Kelvin value">Copy</button>
      </div>
    </section>

    <button id="clearBtn" class="clear-btn" type="button">Clear</button>
  </main>

  <footer class="page-footer">
    Built with HTML, CSS and JavaScript &middot; SkillCraft Technology Internship Task 1
  </footer>

  <script src="js/conversion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
